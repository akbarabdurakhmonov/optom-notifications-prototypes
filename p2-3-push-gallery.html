<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2.3 Push, pop-up and SMS gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Optom.uz prototype base — colours and components taken from the Figma exports (Seller website, Buyer website, Super Admin Old) */
:root{
  --green:#00a028; --green-600:#008a22; --green-50:#e6f6ea; --green-100:#cdeed5;
  --ink:#1b1c1f; --ink-2:#38383b; --muted:#6b7079; --muted-2:#8b9189; --line:#e7e9ec; --line-2:#d9dce1;
  --bg:#f3f4f6; --card:#ffffff; --red:#d92d20; --red-50:#fdecec; --amber:#ca8504; --amber-50:#fef7c3;
  --blue:#0c75ed; --blue-50:#e8f2fe; --violet:#7a5af8; --violet-50:#f1edff;
  --radius:12px; --radius-sm:8px;
  --font:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green);text-decoration:none}
/* ---- prototype harness bar ---- */
.pbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:#14161a;color:#e9ecef;font-size:12.5px}
.pbar b{color:#fff;font-weight:600}
.pbar .tag{background:#2a2e35;border-radius:6px;padding:2px 8px;color:#c6cbd2}
.pbar select{background:#23272e;border:1px solid #3a3f47;border-radius:6px;color:#fff;padding:4px 8px;max-width:420px}
.pbar .sp{flex:1}
.pbar button{background:#23272e;border:1px solid #3a3f47;border-radius:6px;color:#fff;padding:4px 10px;cursor:pointer}
.pbar button.on{background:var(--green);border-color:var(--green)}
.notes{position:fixed;right:16px;bottom:16px;width:380px;max-height:60vh;overflow:auto;z-index:60;background:#fffef5;border:1px solid #eadf9f;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:14px 16px;font-size:12.5px;display:none}
.notes.show{display:block}
.notes h4{margin:0 0 6px;font-size:13px}
.notes ul{margin:4px 0 0 16px;padding:0}
.notes li{margin:3px 0}
.notes .src{color:#6b6200;font-size:11.5px;margin-top:8px}
/* ---- seller / admin shell ---- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 40px)}
.side{padding:18px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:26px;letter-spacing:-.5px;margin:0 6px 22px;color:var(--ink)}
.logo svg{flex:none}
.side .grp{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);cursor:default}
.nav.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);color:var(--ink);font-weight:500}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.8}
.side .me{margin-top:auto;background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.ava{width:34px;height:34px;border-radius:50%;background:#d7dbe0;display:grid;place-items:center;font-weight:600;color:#555;flex:none}
.me small{display:block;color:var(--green);font-size:12px}
.main{padding:16px 24px 40px 8px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.crumbs{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.crumbs b{color:var(--ink);font-weight:500}
.top .sp{flex:1}
.lang{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px}
.h1{font-size:26px;font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:10px}
/* ---- components ---- */
.card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 4px;font-size:18px;font-weight:600}
.sub{color:var(--muted);margin:0}
.row{display:flex;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line)}
.sec>.lbl{font-weight:600}
.sec>.lbl .sub{font-weight:400;font-size:13px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500}
.inp{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-50)}
.inp.err{border-color:var(--red)}
.inp[disabled]{background:#f6f7f9;color:var(--muted)}
.err-t{color:var(--red);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--green);color:#fff}

.btn.out{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn.soft{background:var(--green-50);color:var(--green)}
.btn.dan{background:var(--red-50);color:var(--red)}
.btn.danfill{background:var(--red);color:#fff}
.btn.link{background:none;padding:6px 4px;color:var(--green)}

.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:500;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{background:var(--green-50);color:var(--green);border-color:var(--green-100)}
.pill.v{background:var(--violet-50);color:var(--violet);border-color:#ddd3ff}
.pill.a{background:#fff6e0;color:#b54708;border-color:#fde7b0}
.pill.r{background:var(--red-50);color:var(--red);border-color:#f9c9c4}
.pill.n{background:#f1f2f4;color:var(--ink-2);border-color:var(--line)}
.pill.b{background:var(--blue-50);color:var(--blue);border-color:#c9e0fd}
.alert{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border-left:4px solid}
.alert .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.alert.w{background:var(--amber-50);border-color:var(--amber)} .alert.w .ic{background:var(--amber)}
.alert.e{background:var(--red-50);border-color:var(--red)} .alert.e .ic{background:var(--red)}
.alert.i{background:var(--blue-50);border-color:var(--blue)} .alert.i .ic{background:var(--blue)}
.alert.s{background:var(--green-50);border-color:var(--green)} .alert.s .ic{background:var(--green)}
.alert b{display:block;margin-bottom:2px}
.toggle{position:relative;width:40px;height:22px;border-radius:12px;background:#d0d4da;border:none;cursor:pointer;flex:none;transition:.15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:21px}
.toggle[disabled]{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:8px 0}
.chk input{width:18px;height:18px;accent-color:var(--green);margin-top:2px;flex:none}
table.t{width:100%;border-collapse:collapse}
table.t th{background:#f6f7f9;text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:10px 12px}
table.t td{border-top:1px solid var(--line);padding:12px;vertical-align:middle}
.kv{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.kv:first-of-type{border-top:none}
.kv .k{color:var(--muted)}
.kv svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.6;flex:none;margin-top:1px}
.modal-bg{position:fixed;inset:0;background:rgba(16,18,22,.45);display:grid;place-items:center;z-index:40;padding:20px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:19px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1c1f;color:#fff;border-radius:10px;padding:10px 16px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px}
.digits{display:flex;gap:6px;align-items:flex-end}
.digit{background:#eceef1;border-radius:10px;width:42px;height:52px;display:grid;place-items:center;font-size:24px;font-weight:600}
.dsep{font-size:24px;font-weight:600;padding:0 4px 12px}
.ycard{border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;background:#fff}
.ycard.on{border-color:var(--green);background:var(--green-50)}
.ycard .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.ycard.on .r{border:5px solid var(--green)}
.ycard[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.yglogo{font-weight:700;letter-spacing:-.3px}
.yglogo i{font-style:italic;font-weight:800}
.code-big{font-size:30px;letter-spacing:6px;font-weight:700;background:#f6f7f9;border-radius:10px;padding:8px 14px;display:inline-block}
.steps{display:flex;justify-content:space-between;position:relative;margin:6px 0 4px}
.steps::before{content:"";position:absolute;left:20px;right:20px;top:17px;height:2px;background:var(--line)}
.step{position:relative;text-align:center;flex:1;color:var(--muted);font-size:13px}
.step .dot{width:36px;height:36px;border-radius:10px;margin:0 auto 6px;background:#fff;border:1.5px solid var(--line-2);display:grid;place-items:center}
.step.on{color:var(--green);font-weight:500}
.step.on .dot{background:var(--green-50);border-color:var(--green)}
.timeline .it{display:flex;gap:12px;padding:8px 0}
.timeline .it .d{width:30px;height:30px;border-radius:50%;background:#f1f2f4;display:grid;place-items:center;flex:none;font-size:13px}
.timeline .it small{display:block;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb0{margin-bottom:0}
.spin{width:16px;height:16px;border:2px solid #c8ead1;border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ann{outline:2px dashed #f0b400;outline-offset:3px;border-radius:12px}

/* ---- notification centre components (proposal; follows the buyer mobile "Уведомления" design) ---- */
.bellwrap{position:relative}
.bell{position:relative;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
.bell svg{width:20px;height:20px;stroke:#38383b;fill:none;stroke-width:1.7}
.badge{position:absolute;top:-6px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid #fff}
.dd{position:absolute;right:0;top:46px;width:400px;background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(16,24,40,.18);border:1px solid var(--line);z-index:30;overflow:hidden}
.dd .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.dd .hd b{font-size:16px}
.dd .ft{display:flex;justify-content:center;padding:10px;border-top:1px solid var(--line)}
.ni{display:flex;gap:12px;padding:12px 16px;cursor:pointer;position:relative;border-top:1px solid var(--line)}
.ni:hover{background:#f8f9fa}
.ni.unread{background:#f6fbf7}
.ni .gi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ni .gi svg{width:20px;height:20px;fill:none;stroke-width:1.7}
.gi.o{background:var(--green-50)} .gi.o svg{stroke:var(--green)}
.gi.m{background:var(--blue-50)} .gi.m svg{stroke:var(--blue)}
.gi.s{background:#f1f2f4} .gi.s svg{stroke:#555}
.gi.w{background:var(--red-50)} .gi.w svg{stroke:var(--red)}
.gi.a{background:var(--violet-50)} .gi.a svg{stroke:var(--violet)}
.ni .bd{flex:1;min-width:0}
.ni .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .tx{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.ni .tm{color:var(--muted);font-size:12px;margin-top:4px}
.ni .ud{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;margin-top:6px}
.ni .cid{position:absolute;right:10px;bottom:8px;font-size:10.5px;color:#a0a6ae;font-family:ui-monospace,Menlo,monospace}
.ni .acts{display:flex;gap:8px;margin-top:8px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:0}
.tab{padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--green)}
.tab .c{background:var(--green);color:#fff;border-radius:9px;padding:0 6px;font-size:11.5px;margin-left:6px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:50%;background:#f1f2f4;display:grid;place-items:center;margin:0 auto 12px}
.empty .eic svg{width:30px;height:30px;stroke:#9aa0a8;fill:none;stroke-width:1.6}
/* web pop-up (toast with title, text, first button) */
.npop{position:fixed;top:56px;right:20px;width:360px;background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(16,24,40,.22);border:1px solid var(--line);z-index:65;padding:14px 16px;display:flex;gap:12px;animation:pin .25s ease}
.npop .x{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.npop .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--green);animation:pbar 5s linear forwards;border-radius:0 0 0 14px}

/* buyer website header */
.bweb{background:#fff;min-height:calc(100vh - 40px)}
.bhead{display:flex;align-items:center;gap:16px;padding:14px 32px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:40px;z-index:20}
.bsearch{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:#f3f4f6;border-radius:10px;padding:10px 14px;color:var(--muted)}
.bcat{background:var(--green);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600}
.hic{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--ink-2);gap:2px;cursor:pointer;position:relative}

.bbody{padding:24px 32px;max-width:1240px;margin:0 auto}
.prodgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pimg{height:150px;background:linear-gradient(135deg,#eef0f3,#e3e6ea)}
.pcard .pi{padding:10px 12px}
.pcard .pp{font-weight:700;font-size:16px}
.prof{display:grid;grid-template-columns:260px 1fr;gap:24px}
.pside{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.pside .nav{cursor:pointer}
/* mobile frame */
.phonewrap{display:flex;gap:28px;justify-content:center;padding:24px;flex-wrap:wrap}
.phone{width:375px;height:780px;border-radius:44px;background:#111;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);flex:none}
.scr{width:100%;height:100%;border-radius:34px;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:600;font-size:14px;flex:none}
.mhead{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;flex:none}
.mhead b{font-size:20px;flex:1}
.mbody{flex:1;overflow:auto}
.mtabbar{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 0 22px;font-size:10.5px;color:var(--muted);flex:none}

.mtabbar .on{color:var(--green)} .mtabbar .on svg{stroke:var(--green)}
.pushb{position:absolute;top:46px;left:10px;right:10px;background:rgba(245,245,247,.97);border-radius:18px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5;cursor:pointer;animation:pin .3s ease}

<div id="app"></div><p style="text-align:center;color:#8b9189;font-size:11.5px;margin:18px 0 28px">Optom.uz · clickable prototype for the Notifications user stories (epic US-BF-8.0) · texts from Notifications PRD v1.3 · example data only. Where a prototype differs from the acceptance criteria in Confluence, the acceptance criteria win.</p>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ICON = {

// ---- harness ----
const H = { scen: [], cur: null, notesOn: false };
function harness(meta, scenarios) {
  H.scen = scenarios;
  const bar = document.createElement("div"); bar.className = "pbar";
  bar.innerHTML = `<b>${esc(meta.title)}</b><span class="tag">${esc(meta.stories)}</span><span class="tag">v${meta.version}</span>
    <span>Scenario:</span><select id="scen">${scenarios.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.label)}</option>`).join("")}</select>
    <button id="reset" title="Reset the current scenario">↺ Reset</button><span class="sp"></span>
    <span style="color:#9aa1ab">Prototype · RU UI · notes in English</span>
    <button id="ntoggle">Notes for this state</button>`;
  document.body.prepend(bar);
  const notes = document.createElement("div"); notes.className = "notes"; notes.id = "notes"; document.body.append(notes);
  $("#scen").onchange = e => go(+e.target.value);
  $("#reset").onclick = () => go(+$("#scen").value);
  $("#ntoggle").onclick = () => { H.notesOn = !H.notesOn; notes.classList.toggle("show", H.notesOn); $("#ntoggle").classList.toggle("on", H.notesOn); };
  const q = new URLSearchParams(location.hash.slice(1)), qs = new URLSearchParams(location.search); go(+(q.get("s") || qs.get("s") || 0));
}
function go(i) {
  const s = H.scen[i]; if (!s) return; H.cur = s; $("#scen").value = i; history.replaceState(null, "", "#s=" + i);
  s.apply(); setNotes(s.notes, s.src);
}
function setNotes(list, src) {
  $("#notes").innerHTML = `<h4>What this state shows</h4><ul>${(list || []).map(n => `<li>${n}</li>`).join("")}</ul>${src ? `<div class="src">${src}</div>` : ""}`;
}
let toastT;
function toast(t) { let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.append(el); } el.textContent = t; el.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = "none", 3200); }
function modal(html) { closeModal(); const bg = document.createElement("div"); bg.className = "modal-bg"; bg.id = "mbg"; bg.innerHTML = `<div class="modal">${html}</div>`; document.body.append(bg); return bg; }
function closeModal() { const m = $("#mbg"); if (m) m.remove(); }

// When embedded in a narrow frame (e.g. Confluence iFrame), scale the desktop layout down to fit
(function fitFrame() {
  if (window === window.top) return;
  const apply = () => { const w = document.documentElement.clientWidth; document.documentElement.style.zoom = w < 1280 ? (w / 1280).toFixed(3) : ""; };
  apply(); window.addEventListener("resize", apply);
})();

 "Order updates (can't turn off)", "r": "MVP", "cta": "Link → Seller order page", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "An admin cancels the order", "en": "Order #{order_no} cancelled by Optom.uz\nReason: {reason}. Do not ship the goods.", "uz": "Optom.uz #{order_no} buyurtmani bekor qildi\nSabab: {reason}. Mahsulotlarni jo‘natmang.", "ru": "Optom.uz отменил заказ №{order_no}\nПричина: {reason}. Не отправляйте товары."}, "SOR-06": {"g": "Order updates (can't turn off)", "r": "MVP", "cta": "Link → Seller order page", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "An admin sends a message about an order with \"Send notification\" in the admin order page", "en": "Optom.uz: order #{order_no}\n{message}", "uz": "Optom.uz: #{order_no} buyurtma\n{message}", "ru": "Optom.uz: заказ №{order_no}\n{message}"}, "SOR-07": {"g": "Order updates", "r": "MVP", "cta": "Link → Seller order page", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The buyer confirms receipt or the order is completed automatically", "en": "Order #{order_no} completed\nThe buyer received the order.", "uz": "#{order_no} buyurtma yakunlandi\nXaridor buyurtmani qabul qildi.", "ru": "Заказ №{order_no} завершён\nПокупатель получил заказ."}, "SOR-08": {"g": "Service", "r": "Later", "cta": "Button \"Add stock\" → Product stock", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Stock of a product in a branch falls to the threshold: 5 units, one platform value (⚑ proposed, OQ-N13)", "en": "Low stock\n{product_name}: {qty} left in {branch_name}.", "uz": "Mahsulot kam qoldi\n{product_name}: {branch_name} filialida {qty} dona qoldi.", "ru": "Товар заканчивается\n{product_name}: в филиале {branch_name} осталось {qty} шт."}, "SOR-09": {"g": "Service", "r": "Later", "cta": "Button \"Add stock\" → Product stock", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Stock of a product in a branch becomes 0", "en": "Out of stock\n{product_name}: out of stock in {branch_name}. Add stock so buyers can order it.", "uz": "Mahsulot tugadi\n{product_name}: {branch_name} filialida tugadi. Buyurtma uchun zaxira qo‘shing.", "ru": "Товар закончился\n{product_name}: закончился в филиале {branch_name}. Пополните остаток для заказов."}, "SOR-10": {"g": "Service", "r": "Later", "cta": "Link → Transfer history", "ch": "Web + Mobile", "pp": "Pull only", "oc": "—", "trig": "Stock is transferred to a branch (or a transfer is returned to the previous branch)", "en": "Stock moved\n{product_name}: {qty} units moved from {from_branch} to {branch_name}.", "uz": "Mahsulot ko‘chirildi\n{product_name}: {from_branch} → {branch_name}, {qty} dona.", "ru": "Товар перемещён\n{product_name}: {qty} шт. перемещено из филиала {from_branch} в {branch_name}."}, "DLV-01": {"g": "Order updates", "r": "MVP", "cta": "Button \"Track order\" → Order tracking", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The order gets the status In delivery (Fargo shipment created and picked up, or seller sets \"In delivery\")", "en": "Order #{order_no} is on the way\nDelivery: {method}. Follow the status in the order.", "uz": "#{order_no} buyurtma yo‘lda\nYetkazib berish: {method}. Holatini buyurtmada kuzating.", "ru": "Заказ №{order_no} в пути\nДоставка: {method}. Следите за статусом в заказе."}, "DLV-02": {"g": "Order updates (can't turn off)", "r": "MVP", "cta": "Button \"Contact support\" → Support chat", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The provider or the seller reports a delivery problem (failed attempt, address not found, parcel returned)", "en": "Delivery problem: order #{order_no}\nThe courier could not deliver the order: {reason}. Support will contact you.", "uz": "Yetkazishda muammo: #{order_no}\nKuryer yetkaza olmadi: {reason}. Yordam xizmati siz bilan bog‘lanadi.", "ru": "Проблема с доставкой №{order_no}\nКурьер не смог доставить заказ: {reason}. Поддержка свяжется с вами."}, "DLV-03": {"g": "Order updates (can't turn off)", "r": "MVP", "cta": "Link → Seller order page", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Same delivery problem as DLV-02", "en": "Delivery problem: order #{order_no}\n{provider} reports: {reason}.", "uz": "Yetkazishda muammo: #{order_no}\n{provider} xabari: {reason}.", "ru": "Проблема с доставкой №{order_no}\n{provider} сообщает: {reason}."}, "DLV-04": {"g": "Order updates (can't turn off)", "r": "With pickup", "cta": "Buttons \"Show QR code\" and \"Route\" → Order page / map", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "SMS with the pickup code (proposed, like Uzum)", "trig": "The seller sets the status Ready for pickup", "en": "Order #{order_no} is ready for pickup\nCollect it by {date}: {address}. Show the QR code from the order.", "uz": "#{order_no} buyurtmani olib ketish mumkin\nUni {date} gacha oling: {address}. Buyurtmadagi QR kodni ko‘rsating.", "ru": "Заказ №{order_no} готов к выдаче\nЗаберите его до {date}: {address}. Покажите QR-код из заказа."}, "DLV-05": {"g": "Order updates", "r": "With pickup", "cta": "Button \"Route\" → map", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The pickup storage period ends tomorrow and the order is not collected", "en": "Order #{order_no} is waiting for you\nCollect it by {date}: {address}. Otherwise it will be cancelled.", "uz": "#{order_no} buyurtma sizni kutmoqda\nUni {date} gacha oling: {address}. Aks holda buyurtma bekor qilinadi.", "ru": "Заказ №{order_no} ждёт вас\nЗаберите его до {date}: {address}. Иначе заказ будет отменён."}, "DLV-06": {"g": "Order updates (can't turn off)", "r": "With pickup", "cta": "Link → Order page", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Storage period (5 days) ended without pickup: the order is cancelled with a full refund", "en": "Order #{order_no} not collected\nThe storage period ended and the order was cancelled. Refund: {amount} so‘m.", "uz": "#{order_no} buyurtma olib ketilmadi\nSaqlash muddati tugadi va buyurtma bekor qilindi. Qaytariladigan summa: {amount} so‘m.", "ru": "Заказ №{order_no} не забрали\nСрок хранения истёк, заказ отменён. К возврату: {amount} сум."}, "DLV-07": {"g": "Order updates (can't turn off)", "r": "With pickup", "cta": "Link → Seller order page", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Same as DLV-06", "en": "Order #{order_no} not collected\nThe storage period ended. The order is cancelled; keep the goods.", "uz": "#{order_no} buyurtma olib ketilmadi\nSaqlash muddati tugadi. Buyurtma bekor qilindi, mahsulotlar sizda qoladi.", "ru": "Заказ №{order_no} не забрали\nСрок хранения истёк. Заказ отменён, товары остаются у вас."}, "DLV-08": {"g": "Order updates", "r": "With pickup", "cta": "Buttons \"Confirm receipt\" and \"Report a problem\"", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The seller confirms the pickup handover (QR scan or order number)", "en": "Order #{order_no} handed over\nThank you! If something is wrong with the goods, request a return.", "uz": "#{order_no} buyurtma topshirildi\nRahmat! Mahsulotda muammo bo‘lsa, qaytarish so‘rang.", "ru": "Заказ №{order_no} выдан\nСпасибо! Если с товаром что-то не так, оформите возврат."}, "YG-B1": {"g": "Order updates", "r": "With Yandex Go", "cta": "Button \"Track\" → Order tracking", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "Yandex sends its own SMS with the delivery code", "trig": "Yandex assigns a courier (CourierAssigned)", "en": "Courier found\n{courier_name}, {car}, is going to the seller for order #{order_no}. Track it in the app.", "uz": "Kuryer topildi\n{courier_name}, {car}, #{order_no} buyurtma uchun sotuvchiga ketmoqda. Ilovada kuzating.", "ru": "Курьер найден\n{courier_name}, {car}, едет к продавцу за заказом №{order_no}. Следите в приложении."}, "YG-B2": {"g": "Order updates", "r": "With Yandex Go", "cta": "Button \"Track\"", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The courier picked up the parcel ( tma uchun taxminan {eta} daqiqada keladi. Kod buyurtma sahifasida.", "ru": "Курьер едет\nКурьер {courier_name} приедет за заказом №{order_no} примерно через {eta} мин. Код — на странице заказа."}, "YG-S7": {"g": "Order updates (can't turn off)", "r": "With Yandex Go", "cta": "Link → Seller order page", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Delivery failed and the parcel comes back to the seller (Returning)", "en": "Parcel is coming back\nOrder #{order_no} was not delivered and comes back to you. Give the courier the return code from the order page.", "uz": "Posilka qaytmoqda\n#{order_no} buyurtma yetkazilmadi va sizga qaytmoqda. Kuryerga buyurtma sahifasidagi qaytarish kodini ayting.", "ru": "Посылка возвращается\nЗаказ №{order_no} не доставлен и возвращается к вам. Назовите курьеру код возврата со страницы заказа."}, "YG-S9": {"g": "Service (can't turn off)", "r": "With Yandex Go", "cta": "Button \"Delivery settings\"", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The seller's Yandex Delivery token is no longer valid", "en": "Yandex Go is off: token\nYour Yandex Delivery token stopped working. Add a new token: Settings → Delivery integrations.", "uz": "Yandex Go o‘chirildi: token\nYandex Yetkazib berish tokeni ishlamay qoldi. Yangi token qo‘shing: Sozlamalar → Yetkazib berish integratsiyalari.", "ru": "Yandex Go отключён: токен\nТокен Яндекс Доставки перестал работать. Добавьте новый: Настройки → Интеграции доставки."}, "YG-S10": {"g": "Service (can't turn off)", "r": "With Yandex Go", "cta": "Button \"Delivery settings\"", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The seller's Yandex Delivery balance is too low; Yandex Go is switched off for buyers", "en": "Yandex Go is off: balance\nYour Yandex Delivery balance is too low. Top it up in the Yandex cabinet; until then Yandex Go is off for your shop.", "uz": "Yandex Go o‘chirildi: balans\nYandex Yetkazib berish balansi yetarli emas. Yandex kabinetida to‘ldiring — shungacha Yandex Go o‘chiq.", "ru": "Yandex Go отключён: баланс\nНа балансе Яндекс Доставки мало средств. Пополните его в кабинете Яндекса — до этого Yandex Go отключён."}, "YG-S11": {"g": "Order updates (can't turn off)", "r": "With Yandex Go", "cta": "Button \"Re-book\" → Seller order page", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Support cancelled the courier with the seller as the cause (US-YG-1.9 AC12); [fee] sentence only when {fee} > 0", "en": "Support cancelled the courier\nSupport cancelled the courier for order #{order_no}. [if {fee} > 0:] Fee {fee} so‘m was charged to your Yandex balance. Re-book or cancel the order.", "uz": "Kuryer bekor qilindi\nYordam xizmati #{order_no} kuryerini bekor qildi. [if {fee} > 0:] To‘lov {fee} so‘m Yandex balansidan yechildi. Qayta chaqiring yoki bekor qiling.", "ru": "Поддержка отменила курьера\nПоддержка отменила курьера для заказа №{order_no}. [if {fee} > 0:] Плата {fee} сум списана с баланса Яндекса. Вызовите заново или отмените заказ."}, "YG-S13": {"g": "Service (can't turn off)", "r": "With Yandex Go", "cta": "Link → Settings → Delivery integrations", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Optom.uz switched Yandex Go off for the shop (US-YG-1.13 AC4)", "en": "Optom.uz switched Yandex Go off\nYandex Go is off for your shop. Deliveries already booked continue. Contact Optom.uz support for details.", "uz": "Optom.uz Yandex Go’ni o‘chirdi\nDo‘koningiz uchun Yandex Go o‘chirildi. Chaqirilgan yetkazib berishlar davom etadi. Batafsil: yordam xizmati.", "ru": "Optom.uz отключил Yandex Go\nYandex Go для вашего магазина отключён. Уже вызванные доставки продолжатся. Подробности — в поддержке."}, "YG-S14": {"g": "Service (can't turn off)", "r": "With Yandex Go", "cta": "Link → Settings → Delivery integrations", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "Optom.uz switched Yandex Go on again (US-YG-1.13 AC5)", "en": "Yandex Go is on again\nOptom.uz switched Yandex Go on again for your shop. Buyers see it for the branches where it is on.", "uz": "Yandex Go qayta yoqildi\nOptom.uz do‘koningiz uchun Yandex Go’ni qayta yoqdi. Xaridorlar uni yoqilgan filiallarda ko‘radi.", "ru": "Yandex Go снова включён\nOptom.uz снова включил Yandex Go для вашего магазина. Покупатели видят его в филиалах, где он включён."}, "RET-01": {"g": "Order updates", "r": "With returns", "cta": "Button \"Open chat\" → Return chat", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The buyer creates a return request", "en": "Return request #{return_no} sent\nThe seller will reply within {hours} hours. Add photos or a video in the chat.", "uz": "#{return_no} qaytarish so‘rovi yuborildi\nSotuvchi {hours} soat ichida javob beradi. Chatga rasm yoki video qo‘shing.", "ru": "Заявка на возврат отправлена\nПродавец ответит по заявке №{return_no} в течение {hours} ч. Добавьте фото или видео в чат."}, "RET-02": {"g": "Order updates (can't turn off)", "r": "With returns", "cta": "Button \"Open request\" → Return request", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "E-mail if confirmed (⚑ proposed, OQ-N6)", "trig": "The buyer creates a return request", "en": "New return request #{return_no}\nOrder #{order_no}: {reason}. Reply within {hours} h, or it is approved automatically.", "uz": "Yangi qaytarish so‘rovi #{return_no}\n#{order_no}: {reason}. {hours} soatda javob bering, aks holda avtomatik tasdiqlanadi.", "ru": "Новая заявка на возврат №{return_no}\nЗаказ №{order_no}: {reason}. Ответьте за {hours} ч, иначе возврат одобрится сам."}, "RET-03": {"g": "Order updates (can't turn off)", "r": "With returns", "cta": "Button \"Open request\"", "ch": "Web + Mobile", "pp": "Push + Pull", "oc": "—", "trig": "The seller has not decided and 12 hours are left before the deadline", "en": "Return #{return_no}: {hours_left} h left\nApprove or decline it before {time}.", "uz": "#{return_no} qaytarish: {hours_left} soat qoldi\nUni {time} gacha tasdiqlang yok
